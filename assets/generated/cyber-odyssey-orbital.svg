@keyframes co-pulse{0%,100%{opacity:0}50%{opacity:0.55}}
.co-pulse{opacity:0;animation:co-pulse 5.2s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.co-a,.co-hl,.co-pulse{animation-play-state:paused!important}.co-hl{display:none}}
